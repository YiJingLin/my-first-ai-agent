# PR check: unit tests for each lab with tests/ (mocked OpenAI — no API key).
#
# Add a project to matrix.project when that lab gets a tests/ suite.
#
# Scale-up note (~5+ labs with tests/):
# Prefer an explicit matrix over one mega-job. Once labs grow further, consider
# path filters / change detection so PRs only run pytest for projects that
# changed (full suite on main). See TODO.md → PR checks.
name: Unit tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    name: ${{ matrix.project }} pytest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - 1_profile_chatbot
          - 2_harness
    defaults:
      run:
        working-directory: ${{ matrix.project }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ${{ matrix.project }}/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -v
