# PR check: unit tests for 1_profile_chatbot/agent (mocked OpenAI — no API key).
name: Profile chatbot tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    name: 1_profile_chatbot pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 1_profile_chatbot

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: 1_profile_chatbot/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -v
